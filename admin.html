<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080c1b">
<title>BasStore — админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080c1b;--surface:#0e1530;--surface-2:#131c3d;--line:#232f5e;--ink:#eef2ff;--dim:#9fadd3;--blue:#2f5bff;--hi:#5c86ff;--ok:#52d8a2;--wait:#ffc872;--bad:#ff7a8a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.dim{color:var(--dim);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 15px inherit;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--hi)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;min-height:46px;padding:0 14px;font:inherit;font-size:16px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
textarea{padding:10px 14px;min-height:70px}
label{display:block;margin:12px 0 6px;font-size:13px;font-weight:600;color:var(--dim)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row>*{min-width:0}
.item{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;margin-bottom:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.item>*{min-width:0}
.item .t{font-weight:700;overflow-wrap:anywhere}
.ph{width:56px;height:56px;border-radius:10px;background:var(--surface-2) center/cover no-repeat;border:1px solid var(--line)}
.tag{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.tag.off{color:var(--wait);border-color:var(--wait)}
.card{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.photos{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0}
.pw{position:relative;width:84px;height:84px}
.pw .ph{width:84px;height:84px}
.pw button{position:absolute;top:-6px;right:-6px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#000c;color:#fff;font-size:16px;cursor:pointer}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px}
.sw input{width:22px;min-height:22px;height:22px}
.sw label{margin:0;font-size:15px;color:var(--ink)}
.err{color:var(--bad);min-height:20px;margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#fff;color:#0a1030;font-weight:700;padding:12px 18px;border-radius:12px;z-index:9}
code{background:var(--surface-2);padding:2px 6px;border-radius:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">

<section id="vMsg" class="card" hidden>
  <h2 id="msgTitle"></h2>
  <p id="msgText" class="dim" style="margin-top:10px"></p>
  <p id="msgId" hidden style="margin-top:10px">Ваш Telegram ID: <code id="myId"></code></p>
  <p style="margin-top:14px"><button class="btn" id="retry" hidden>Повторить</button></p>
</section>

<section id="vList" hidden>
  <div class="bar"><h1>Товары</h1><button class="btn primary" id="addNew">+ Добавить</button></div>
  <input id="search" type="search" placeholder="Поиск по названию" autocomplete="off">
  <p class="dim" id="count" style="margin:10px 0"></p>
  <div id="items"></div>
  <p style="margin-top:18px"><a class="dim" href="index.html">← В магазин</a></p>
</section>

<section id="vEdit" hidden>
  <div class="bar"><h1 id="eTitle">Товар</h1><button class="btn" id="back">Назад</button></div>
  <div class="card">
    <label for="fName">Название</label><input id="fName" maxlength="150" autocomplete="off">
    <label for="fCat">Категория</label><input id="fCat" list="cats" maxlength="60" placeholder="Например: телефоны" autocomplete="off"><datalist id="cats"></datalist>
    <div class="row">
      <div><label for="fPrice">Цена, ₽</label><input id="fPrice" type="text" inputmode="numeric" autocomplete="off"></div>
      <div><label for="fStatus">Наличие</label><select id="fStatus"><option value="stock">В наличии</option><option value="preorder">Под заказ</option></select></div>
    </div>
    <div id="etaWrap" hidden><label for="fEta">Срок (для «Под заказ»)</label><input id="fEta" maxlength="40" placeholder="Например: 7–10 дней"></div>
    <label for="fSizes">Размеры или память (через запятую)</label><input id="fSizes" placeholder="40, 41, 42  или  256 ГБ, 512 ГБ" autocomplete="off">
    <label for="fColors">Цвета (через запятую)</label><input id="fColors" placeholder="Чёрный, Белый" autocomplete="off">
    <label>Фото</label>
    <div class="photos" id="photos"></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <button class="btn block" id="pick" type="button">+ Добавить фото</button>
    <p class="dim" id="upState" style="margin-top:6px"></p>
    <div class="sw"><input type="checkbox" id="fShow" checked><label for="fShow">Показывать в магазине</label></div>
    <p class="err" id="eErr" role="alert"></p>
    <button class="btn primary block" id="save">Сохранить</button>
    <p style="margin-top:12px"><button class="btn danger block" id="del" hidden>Удалить товар</button></p>
  </div>
</section>

</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
/* Адрес серверной части (Google Apps Script). Вставьте сюда ссылку из шага «Развернуть». Это НЕ секрет. */
var API_URL='https://script.google.com/macros/s/AKfycbwxpNCUJQWr6kEvBpQb1E95NujJPdI9T9e-4_58hNA2fjhzvOEeKI21iIHvsKvtbbmU/exec';

var TG=window.Telegram&&window.Telegram.WebApp;
var initData=(TG&&TG.initData)||'';
var tgUser=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor('#080c1b');TG.setBackgroundColor('#080c1b');}catch(e){}}

function $(id){return document.getElementById(id);}
function show(v){['vMsg','vList','vEdit'].forEach(function(x){$(x).hidden=x!==v;}); window.scrollTo(0,0); backSync(v);}
function backSync(v){if(!TG)return; try{if(v==='vEdit')TG.BackButton.show(); else TG.BackButton.hide();}catch(e){}}
var toastT;
function toast(t){var e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true;},2200);}
function msg(title,text,showId,retry){
  $('msgTitle').textContent=title; $('msgText').textContent=text;
  $('msgId').hidden=!showId; $('myId').textContent=tgUser?String(tgUser.id):'не определён';
  $('retry').hidden=!retry; show('vMsg');
}

function api(action,extra){
  var body={action:action,initData:initData};
  for(var k in extra) body[k]=extra[k];
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)})
    .then(function(r){return r.json();});
}

var products=[],cur=null,photos=[],busy=false,delArmed=false;

function thumb(u,w){
  var m=/drive\.google\.com\/file\/d\/([\w-]+)/.exec(u||'');
  return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w'+(w||200):(u||'');
}
function money(n){return new Intl.NumberFormat('ru-RU').format(n)+' ₽';}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

function load(){
  if(!initData){msg('Откройте из Telegram','Эта страница работает только внутри Telegram: откройте её из вашего бота.',false,false);return;}
  if(!API_URL||/PASTE/.test(API_URL)){msg('Админка ещё не подключена','Не вставлена ссылка на сервер (API_URL в файле admin.html). Ваш Telegram ID нужен для настройки:',true,false);return;}
  msg('Загрузка…','Проверяем доступ.',false,false);
  api('list').then(function(r){
    if(r.error==='forbidden'){msg('Нет доступа','Эта страница только для администратора магазина. Если вы владелец, добавьте свой ID в настройки сервера:',true,false);return;}
    if(!r.ok){msg('Ошибка','Сервер ответил с ошибкой. Попробуйте позже.',false,true);return;}
    products=r.products; renderList(); show('vList');
  }).catch(function(){msg('Нет связи','Не удалось связаться с сервером. Проверьте интернет и ссылку API_URL.',false,true);});
}

function renderList(){
  var q=$('search').value.trim().toLowerCase();
  var list=products.filter(function(p){return !q||p.name.toLowerCase().indexOf(q)>-1;});
  $('count').textContent='Всего: '+products.length+(q?', найдено: '+list.length:'');
  $('items').innerHTML=list.map(function(p){
    var i=products.indexOf(p);
    return '<button type="button" class="item" data-i="'+i+'"><div class="ph" style="background-image:url(\''+esc(thumb(p.imgs[0],120))+'\')"></div>'+
      '<div><div class="t">'+esc(p.name)+'</div><div class="dim">'+esc(p.cat)+' · '+money(p.price)+' · '+(p.status==='stock'?'в наличии':'под заказ')+'</div></div>'+
      '<span class="tag'+(p.show?'':' off')+'">'+(p.show?'на витрине':'скрыт')+'</span></button>';
  }).join('')||'<p class="dim">Ничего не найдено.</p>';
  var cats=[];products.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat);});
  $('cats').innerHTML=cats.map(function(c){return '<option value="'+esc(c)+'">';}).join('');
}

function openEdit(p){
  cur=p||null; delArmed=false;
  $('eTitle').textContent=p?'Изменить товар':'Новый товар';
  $('fName').value=p?p.name:''; $('fCat').value=p?p.cat:'';
  $('fPrice').value=p?p.price:''; $('fStatus').value=p?p.status:'stock';
  $('fEta').value=p?p.eta:''; $('fSizes').value=p?p.sizes:''; $('fColors').value=p?p.colors:'';
  $('fShow').checked=p?p.show:true;
  photos=p?p.imgs.slice():[];
  $('eErr').textContent=''; $('upState').textContent='';
  $('del').hidden=!p; $('del').textContent='Удалить товар';
  syncEta(); renderPhotos(); show('vEdit');
}
function syncEta(){$('etaWrap').hidden=$('fStatus').value!=='preorder';}
function renderPhotos(){
  $('photos').innerHTML=photos.map(function(u,i){
    return '<div class="pw"><div class="ph" style="background-image:url(\''+esc(thumb(u,200))+'\')"></div><button type="button" data-rm="'+i+'" aria-label="Убрать фото">×</button></div>';
  }).join('');
}

/* сжимаем фото на телефоне до 1000 px, чтобы грузилось быстро */
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1000,k=Math.min(1,max/Math.max(img.width,img.height));
      var c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'));};
    img.src=url;
  });
}
async function uploadFiles(files){
  var list=Array.prototype.slice.call(files);
  for(var i=0;i<list.length;i++){
    if(photos.length>=8){toast('Не больше 8 фото');break;}
    $('upState').textContent='Загрузка фото '+(i+1)+' из '+list.length+'…';
    try{
      var data=await shrink(list[i]);
      var r=await api('upload',{mime:'image/jpeg',data:data});
      if(r.ok){photos.push(r.url); renderPhotos();} else {$('eErr').textContent=r.error||'Не удалось загрузить фото';}
    }catch(e){$('eErr').textContent='Не удалось загрузить фото';}
  }
  $('upState').textContent=''; $('file').value='';
}

function save(){
  if(busy) return;
  var name=$('fName').value.trim();
  var price=parseInt($('fPrice').value.replace(/[^\d]/g,''),10);
  if(!name){$('eErr').textContent='Укажите название.';return;}
  if(!(price>=0)){$('eErr').textContent='Укажите цену цифрами.';return;}
  var prod={name:name,cat:$('fCat').value.trim(),price:price,status:$('fStatus').value,eta:$('fEta').value.trim(),
    sizes:$('fSizes').value,colors:$('fColors').value,imgs:photos,show:$('fShow').checked};
  busy=true; $('save').disabled=true; $('eErr').textContent='';
  api('save',{row:cur?cur.row:0,orig:cur?cur.name:'',product:prod}).then(function(r){
    busy=false; $('save').disabled=false;
    if(r.ok){toast('Сохранено'); refresh();}
    else if(r.error==='conflict'){$('eErr').textContent='Таблица изменилась. Вернитесь к списку и откройте товар заново.';}
    else $('eErr').textContent=r.error&&r.error!=='server_error'?r.error:'Не удалось сохранить. Попробуйте ещё раз.';
  }).catch(function(){busy=false;$('save').disabled=false;$('eErr').textContent='Нет связи с сервером.';});
}
function del(){
  if(!cur) return;
  if(!delArmed){delArmed=true;$('del').textContent='Нажмите ещё раз: удалить навсегда';return;}
  api('delete',{row:cur.row,orig:cur.name}).then(function(r){
    if(r.ok){toast('Удалено'); refresh();} else $('eErr').textContent='Не удалось удалить. Откройте товар заново.';
  }).catch(function(){$('eErr').textContent='Нет связи с сервером.';});
}
function refresh(){
  api('list').then(function(r){if(r.ok){products=r.products;renderList();} show('vList');}).catch(function(){show('vList');});
}

$('items').addEventListener('click',function(e){var b=e.target.closest('.item');if(b)openEdit(products[+b.getAttribute('data-i')]);});
$('addNew').addEventListener('click',function(){openEdit(null);});
$('back').addEventListener('click',function(){show('vList');});
$('search').addEventListener('input',renderList);
$('fStatus').addEventListener('change',syncEta);
$('pick').addEventListener('click',function(){$('file').click();});
$('file').addEventListener('change',function(e){if(e.target.files.length) uploadFiles(e.target.files);});
$('photos').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b){photos.splice(+b.getAttribute('data-rm'),1);renderPhotos();}});
$('save').addEventListener('click',save);
$('del').addEventListener('click',del);
$('retry').addEventListener('click',load);
if(TG){try{TG.BackButton.onClick(function(){if(!$('vEdit').hidden)show('vList');});}catch(e){}}
load();
})();
</script>
</body>
</html>
